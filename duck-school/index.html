<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>这破学让鸭上</title><meta name="description" content="一只鸭，八节课。动手把离谱的要求变得更离谱。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff66aa'/%3E%3Ctext x='5' y='25' font-size='24'%3E嘎%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><main><header><span class="tag">今日替课生 · 鸭</span><button id="sound" aria-pressed="false">声音：关</button></header><div class="title"><h1>这破学<span>让鸭上</span></h1><div class="seal">人类请假<br>鸭鸭代打</div></div><nav aria-label="课程"><button data-level="0" class="active">01 闭眼都会</button><button data-level="1">02 装进脑子</button><button data-level="2">03 上去写</button><button data-level="3">04 抓住重点</button><button data-level="4">05 过耳不忘</button><button data-level="5">06 别走神</button><button data-level="6">07 安排明白</button><button data-level="7">08 期末鸭轴</button></nav><section class="game" aria-label="互动游戏"><div class="lesson"><span id="lessonLabel">第一节 · 物理意义上的闭眼</span><strong id="quote">“这题闭着眼都会！”</strong></div><canvas id="game" width="720" height="740" aria-label="游戏区域，可以拖动鸭子、书本，或使用下方操作按钮"></canvas><div class="hud"><span id="count">任务：先把灯关了</span><span id="status">鸭听懂了。</span></div></section><section class="controls"><p id="hint">老师说不用看。那还开灯干什么？</p><div id="options" aria-label="点按操作"></div><div class="buttons"><button id="action" class="primary">关灯，听老师的</button><button id="reset" class="reset" aria-label="重玩本节">重来</button></div><p class="micro">能拖就拖，懒得拖就点 · 不催你，错了随时重来</p></section><footer><span>认真执行。完全跑偏。</span><span id="grade">离谱学分 0 / 8</span></footer></main><script src="game.js?v=8.1"></script></body></html>
