<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ff9abe">
  <title>心情小岛 · Mood Island</title>
  <meta name="description" content="用可爱的小团子记下一周心情，也收好每天做过的小事。">
  <link rel="stylesheet" href="style.css">
  <style>
    .backup{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 18px;margin:8px 0 12px;padding:14px 16px;border:2px solid #9c7e91;border-radius:16px;background:#fff9e9}
    .backup h2{font-size:17px;margin:0}.backup p{font-size:13px;line-height:1.5;margin:3px 0 0;color:#75576a}.backup-actions{display:flex;gap:8px}
    .backup-actions button{padding:7px 11px;border-width:1.5px;border-radius:10px;font-size:13px;box-shadow:none}.backup #backup-status{grid-column:1/-1;font-size:12px;color:#866f7e;margin:0}
    .small-things{margin-top:24px;padding-top:22px;border-top:2px dashed #deccd6}.small-things-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.small-things-head label{margin:0}.small-things-head span{font-size:13px;color:#796276}
    #thing-input{display:block;width:100%;min-height:0;height:48px;margin-top:10px;padding:0 14px;border:2px solid #deccd6;border-radius:15px;font:inherit;color:inherit;background:#fffafc}#thing-input:focus-visible{outline:4px solid #704eff;outline-offset:2px}.thing-categories{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.thing-category{padding:7px 10px!important;border-color:transparent;border-radius:999px;font-size:13px}.thing-category.on{border-color:#42213e;box-shadow:2px 3px 0 #42213e}
    .thing-add{display:block;margin-left:auto;padding:8px 12px}.thing-list{display:grid;gap:7px;margin-top:12px}.thing-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 11px;border:2px solid #deccd6;border-radius:12px;background:#fffafc}.thing-remove{flex:0 0 auto;padding:1px 8px;border:0;background:transparent;font-size:20px}.thing-empty,#thing-status{font-size:13px;color:#796276;margin:8px 0 0}
    .visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    @media(max-width:650px){.backup{grid-template-columns:1fr;padding:13px}.backup-actions button{flex:1;padding:8px 6px}.thing-categories{display:grid;grid-template-columns:repeat(2,1fr)}.thing-category{width:100%}.thing-add{width:100%;margin-top:2px}}
  </style>
</head>
<body>
  <main>
    <header>
      <span class="brand">MOOD ISLAND ✳</span>
      <button id="share">分享小岛 ↗</button>
    </header>

    <section class="intro">
      <div>
        <p class="eyebrow">给每一种心情，一个位置</p>
        <h1>这一周，<br>你是什么味道？</h1>
        <p>选一天，放下你的心情小团子。</p>
      </div>
      <img class="stickers" src="moods.png" alt="六只不同心情的彩色小团子">
    </section>

    <section class="board">
      <div class="weekbar">
        <button id="prev" aria-label="上一周">←</button>
        <div>
          <h2 id="range"></h2>
          <button id="thisweek" class="text">回到本周</button>
        </div>
        <button id="next" aria-label="下一周">→</button>
      </div>
      <div id="days" class="days"></div>
      <div class="bottom">
        <span id="summary">还没记录也没关系，从今天开始。</span>
        <span>一周七天，不必每天晴天 ☁</span>
      </div>
    </section>

    <section class="editor">
      <div class="editorhead">
        <h2 id="selected"></h2>
        <span>可以选不止一种</span>
      </div>
      <div id="moods" class="moods"></div>
      <label for="note">今天想留下一句什么？ <span>可不填</span></label>
      <textarea id="note" maxlength="160" placeholder="比如：什么也没干，但猫在我旁边睡了一下午。"></textarea>
      <div class="small-things">
        <div class="small-things-head">
          <label for="thing-input">今天做了什么小事？ <span>可不填</span></label>
          <span id="thing-count">0/3</span>
        </div>
        <input id="thing-input" type="text" maxlength="80" placeholder="写下一件就很好">
        <div id="thing-categories" class="thing-categories" aria-label="给这件小事选一个类别，可不选"></div>
        <button id="thing-add" class="thing-add" type="button">收下这件小事 ＋</button>
        <div id="thing-list" class="thing-list"></div>
        <p id="thing-status" role="status" aria-live="polite"></p>
      </div>
      <div class="actions">
        <span id="status" role="status" aria-live="polite"></span>
        <button id="save" class="primary">把今天收好 ♥</button>
      </div>
    </section>

    <section class="export">
      <div>
        <h2>带走这一周</h2>
        <p>把七天的小情绪，装进一张卡片。</p>
      </div>
      <div>
        <label class="check"><input type="checkbox" id="include"> 分享卡包含小记</label>
        <button id="download" class="primary">生成心情卡 ↓</button>
      </div>
    </section>

    <section class="backup" aria-labelledby="backup-title">
      <div>
        <h2 id="backup-title">备份记录</h2>
        <p>清理浏览器或换设备前，先导出一份。文件不会上传。</p>
      </div>
      <div class="backup-actions">
        <button id="backup-export">导出备份 ↓</button>
        <button id="backup-import">恢复备份 ↑</button>
        <input id="backup-file" class="visually-hidden" type="file" accept="application/json,.json">
      </div>
      <p id="backup-status" role="status" aria-live="polite">包含心情、小记和小事记录。</p>
    </section>

    <footer>只保存在当前浏览器 · 不用打分，也不用表现得很好。</footer>
  </main>

  <dialog id="carddialog">
    <button class="close" id="close" aria-label="关闭">×</button>
    <h2>这是你的这一周 🍬</h2>
    <img id="cardimage" alt="本周心情分享卡">
    <p>手机上也可以长按图片保存。</p>
    <a id="cardlink" download="我的一周心情.png" class="primary">下载图片</a>
  </dialog>

  <script src="app.js?v=20260911-small-things"></script>
</body>
</html>
